<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoodDay Onboarding Milestones Tracker</title>
<style>
  @import url('https://cdn.shopify.com/static/fonts/inter/v4/styles.css');
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --done-bg:#C0F2DD; --done-bd:#23C48C; --done-tx:#0C3B2F; --done-dot:#23C48C;
    --prog-bg:#FCF0D4; --prog-bd:#F2B322; --prog-tx:#875C08; --prog-dot:#F2B322;
    --crit-bg:#FDE2DD; --crit-bd:#F24122; --crit-tx:#9F200A; --crit-dot:#F24122;
    --na-bg:#F1F2F4;   --na-bd:#DDE0E4;   --na-tx:#87909B;   --na-dot:#ABB1BA;
    --blank-bg:#FFFFFF;--blank-bd:#E3E3E3;--blank-tx:#616161;--blank-dot:#CACED3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',-apple-system,system-ui,'Segoe UI',sans-serif;color:#303030;-webkit-font-smoothing:antialiased;
    background-color:#ECEEF0;
    background-image:
      radial-gradient(1200px 340px at 50% -90px, rgba(51,204,153,0.12), transparent 72%),
      radial-gradient(circle at 1px 1px, rgba(12,58,44,0.05) 1px, transparent 0);
    background-size:auto, 22px 22px;
    background-attachment:fixed;
    min-height:100vh;display:flex;flex-direction:column;
  }
  a{color:#2463BC;text-decoration:none;} a:hover{text-decoration:underline;}

  header{display:flex;align-items:center;gap:12px;padding:14px 24px;background:#fff;box-shadow:inset 0 -1px 0 0 #E3E3E3;position:sticky;top:0;z-index:30;}
  .logo{width:30px;height:30px;border-radius:7px;flex:0 0 auto;box-shadow:inset 0 0 0 1px #E3E3E3;overflow:hidden;display:block;}
  .logo svg{width:30px;height:30px;display:block;}
  .title-wrap{display:flex;flex-direction:column;line-height:1.15;}
  .title-wrap .t{font-size:16px;font-weight:600;letter-spacing:-.005em;color:#303030;}
  .title-wrap .s{font-size:11px;font-weight:500;color:#616161;}
  .head-actions{margin-left:auto;display:flex;gap:8px;align-items:center;}
  .btn{font:600 12px 'Inter',sans-serif;background:#fff;border:1px solid #E3E3E3;border-radius:8px;padding:8px 12px;cursor:pointer;color:#303030;box-shadow:0 1px 0 rgba(0,0,0,.04);}
  .btn:hover{background:#F6F6F7;border-color:#B5B5B5;}
  .btn.sub{color:#616161;box-shadow:none;}

  .toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 24px;background:#fff;box-shadow:inset 0 -1px 0 0 #E3E3E3;position:sticky;top:59px;z-index:25;}
  .tb-label{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#616161;}
  .chip-row{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{display:inline-flex;align-items:center;gap:6px;font:600 11.5px 'Inter',sans-serif;border:1px solid #E3E3E3;background:#fff;color:#303030;border-radius:9999px;padding:4px 10px 4px 8px;cursor:pointer;}
  .chip .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .chip.off{background:#F1F2F4;color:#B5B5B5;border-color:#E3E3E3;opacity:.6;}
  .search{font:400 13px 'Inter',sans-serif;border:1px solid #E3E3E3;border-radius:8px;padding:7px 11px;min-width:180px;outline:none;color:#303030;}
  .search:focus{border-color:#33CC99;}
  .hint{font-size:11px;color:#616161;}

  .tabs{display:flex;gap:4px;align-items:center;padding:0 24px;background:#fff;box-shadow:inset 0 -1px 0 0 #E3E3E3;position:sticky;top:59px;z-index:26;}
  .tab{position:relative;font:600 13px 'Inter',sans-serif;color:#616161;background:none;border:none;padding:12px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab:hover{color:#303030;}
  .tab.active{color:#0B5C46;border-bottom-color:#33CC99;}
  .view{display:none;}
  .view.active{display:block;}

  .board-scroll{flex:1;overflow-x:auto;padding:18px 24px 40px;}
  .board-scroll::-webkit-scrollbar{height:10px;}
  .board-scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,.22);border-radius:9999px;border:2px solid transparent;background-clip:padding-box;}
  #board{display:grid;column-gap:5px;row-gap:5px;width:max-content;min-width:100%;align-items:stretch;}

  .prio-wrap{padding:22px 24px 48px;}
  .prio-head{display:flex;align-items:baseline;gap:10px;margin:0 0 4px;}
  .prio-head .t{font-size:18px;font-weight:600;letter-spacing:-.01em;color:#0C3B2F;}
  .prio-head .s{font-size:12px;color:#616161;}
  .prio-date{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#87909B;margin:0 0 18px;}
  .prio-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:1160px;}
  @media(max-width:760px){.prio-grid{grid-template-columns:1fr;}}
  .pcard{background:#fff;border:1px solid #E3E3E3;border-radius:12px;padding:16px 18px 18px;box-shadow:0 1px 2px rgba(12,58,44,.04);}
  .pcard h3{margin:0 0 12px;font-size:14.5px;font-weight:600;color:#303030;display:flex;align-items:center;gap:8px;}
  .pcard h3 a{margin-left:auto;font-size:12px;color:#199E85;font-weight:600;text-decoration:none;opacity:.8;}
  .pcard h3 a:hover{opacity:1;text-decoration:none;}
  .pcard .sub{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#87909B;margin:14px 0 4px;}
  .pcard ul{list-style:none;margin:0;padding:0;}
  .pcard li{position:relative;display:flex;align-items:flex-start;gap:6px;padding:5px 0 5px 20px;font-size:13px;line-height:1.4;color:#3a3a3a;border-bottom:1px solid #F1F2F4;}
  .pcard li:before{content:"";position:absolute;left:4px;top:12px;width:6px;height:6px;border-radius:50%;background:#33CC99;}
  .pcard li.evt{color:#87909B;}
  .pcard li.evt:before{background:#CDD3DA;}
  .pcard li .ptext{flex:1;min-width:0;outline:none;border-radius:4px;padding:1px 3px;margin:-1px -3px;}
  .pcard li .ptext:focus{background:#F1FBF7;box-shadow:inset 0 0 0 1px #9FE3C9;}
  .pcard li .pmove,.pcard li .pdel{flex:0 0 auto;border:none;background:none;cursor:pointer;color:#C0C4CA;font-size:13px;line-height:1;padding:2px 3px;border-radius:4px;opacity:0;transition:opacity .12s;}
  .pcard li:hover .pmove,.pcard li:hover .pdel{opacity:1;}
  .pcard li .pmove:hover{color:#199E85;background:#EAF7F1;}
  .pcard li .pdel:hover{color:#F24122;background:#FDECE8;}
  .pcard li.padd{display:block;padding:7px 0 3px 20px;font-size:12px;font-weight:600;color:#199E85;cursor:pointer;border-bottom:none;}
  .pcard li.padd:before{display:none;}
  .pcard li.padd:hover{color:#0B5C46;}
  .pcard .empty{font-size:12px;color:#ABB1BA;font-style:italic;padding:4px 0;}

  .band{align-self:end;text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:6px;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .band.std{background:#D2F1E7;color:#0B5C46;}
  .band.cust{background:#EBECEF;color:#4A4A4A;}
  .hcell{align-self:end;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#8A8A8A;text-align:center;padding-bottom:6px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hcell.acct{text-align:left;padding-left:2px;}
  .hcell.custhint{text-align:right;padding-right:2px;color:#B5B5B5;font-weight:500;text-transform:none;letter-spacing:0;}

  .acct{position:sticky;left:0;z-index:2;background:#fff;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 6px;box-shadow:inset -1px 0 0 0 #E3E3E3;border-radius:5px 0 0 5px;}
  .acct .bdot{width:7px;height:7px;border-radius:50%;background:#33CC99;flex:0 0 auto;}
  .acct .name{flex:1;font-size:13px;font-weight:600;color:#303030;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .acct .acctlink{flex:0 0 auto;font-size:13px;line-height:1;color:#199E85;text-decoration:none;padding:0 2px;opacity:.75;cursor:pointer;}
  .acct .acctlink:hover{opacity:1;color:#33CC99;text-decoration:none;}
  .acct .del{flex:0 0 auto;width:18px;height:18px;border:none;background:transparent;color:#CACED3;font-size:15px;line-height:1;cursor:pointer;padding:0;}
  .acct .del:hover{color:#F24122;}

  .golive{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:32px;border-radius:5px;cursor:pointer;}
  .golive .gt{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;pointer-events:none;}
  .golive .gs{font-size:8.5px;letter-spacing:.02em;opacity:.75;margin-top:1px;pointer-events:none;}
  .golive input[type=date]{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:none;background:transparent;color:transparent;opacity:0;cursor:pointer;z-index:3;}
  .golive input[type=date]::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:0;cursor:pointer;}
  .golive input[type=date]::-webkit-inner-spin-button,.golive input[type=date]::-webkit-clear-button{display:none;}
  .golive input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;}

  .tile{border-radius:5px;cursor:pointer;min-height:32px;display:flex;align-items:center;justify-content:center;padding:3px 4px;transition:opacity .12s,box-shadow .12s;}
  .tile:hover{box-shadow:0 2px 8px rgba(12,58,44,.14), inset 0 0 0 1px currentColor;}
  .tile .lbl{font-size:11px;font-weight:600;text-align:center;line-height:1.1;white-space:nowrap;}
  .tile.dim{opacity:.14;}

  .cust{position:relative;}
  .cust .del{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;border:none;background:#87909B;color:#fff;font-size:11px;line-height:1;cursor:pointer;padding:0;opacity:.55;}
  .cust .del:hover{opacity:1;background:#F24122;}
  .cust .lbl[contenteditable]:focus,.acct .name[contenteditable]:focus{outline:none;background:rgba(51,204,153,.16);border-radius:3px;}
  .cust-empty{border-radius:5px;min-height:32px;}
  .addcust{align-self:stretch;min-height:32px;border:1px dashed #DDE0E4;background:#fff;color:#B5B5B5;border-radius:5px;font-size:15px;font-weight:600;cursor:pointer;padding:0;}
  .addcust:hover{border-color:#33CC99;color:#199E85;background:#F0FDF8;}

  .add-acct{margin-top:14px;font:600 13px 'Inter',sans-serif;color:#616161;background:#fff;border:1px dashed #DDE0E4;border-radius:8px;padding:10px 16px;cursor:pointer;}
  .add-acct:hover{border-color:#33CC99;color:#199E85;background:#F0FDF8;}

  .summary{display:flex;gap:22px;flex-wrap:wrap;align-items:center;padding:12px 24px;background:#fff;box-shadow:inset 0 1px 0 0 #E3E3E3;position:sticky;bottom:0;z-index:20;}
  .summary .metric{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#303030;}
  .summary .metric .dot{width:10px;height:10px;border-radius:50%;}
  .summary .metric b{font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;}
  .summary .agg{font-size:12.5px;color:#616161;}
  .summary .agg b{font-family:'IBM Plex Mono',monospace;font-weight:600;color:#303030;}
  .summary .agg .pct{color:#199E85;}

  .menu{position:fixed;z-index:501;background:#fff;border:1px solid #E3E3E3;border-radius:10px;box-shadow:0 12px 24px -6px rgba(0,0,0,.14),0 4px 8px -2px rgba(0,0,0,.08);padding:6px;min-width:176px;display:none;}
  .menu.open{display:block;}
  .menu .opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:500;color:#303030;}
  .menu .opt:hover{background:#F1F2F4;}
  .menu .sw{width:15px;height:15px;border-radius:4px;flex:0 0 auto;}
  .backdrop{position:fixed;inset:0;z-index:500;display:none;}
  .backdrop.open{display:block;}
</style>
</head>

</header>

<div class="tabs" id="tabs">
  <button class="tab active" data-view="scoreboard">Milestones scoreboard</button>
  <button class="tab" data-view="priorities">Priorities this week</button>

<div class="view active" id="view-scoreboard">
  <div class="toolbar">

  <div class="summary" id="summary"></div>

<script>
(function(){
  var STATUS = {
    done:{label:'Complete',bg:'--done-bg',bd:'--done-bd',tx:'--done-tx',dot:'#23C48C'},
    progress:{label:'In progress',bg:'--prog-bg',bd:'--prog-bd',tx:'--prog-tx',dot:'#F2B322'},
    critical:{label:'Critical',bg:'--crit-bg',bd:'--crit-bd',tx:'--crit-tx',dot:'#F24122'},
    na:{label:'Not needed',bg:'--na-bg',bd:'--na-bd',tx:'--na-tx',dot:'#ABB1BA'},
    blank:{label:'Not started',bg:'--blank-bg',bd:'--blank-bd',tx:'--blank-tx',dot:'#CACED3'}
  };
  var ORDER = ['done','progress','critical','na','blank'];
  var KEY = 'goodday_onboarding_tracker_std_v2';
  var filters = {done:true,progress:true,critical:true,na:true,blank:true};
  var search = '';
  var state = null;
  var menuCb = null;

  function id(){ return 'x'+Math.random().toString(36).slice(2,9); }
  function esc(s){ return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function seed(){
    var mk=function(o){var b={Discovery:'blank',Data:'blank',Training:'blank',Reporting:'blank','SC Live':'blank',Wholesale:'blank','Go Live':'blank',WMS:'blank'};for(var k in o)b[k]=o[k];return b;};
    var C=function(l,s){return {id:id(),label:l,status:s};};
    return {
      standardCols:['Discovery','Data','Training','Reporting','SC Live','Wholesale','Go Live','WMS'],
      accounts:[
        {id:id(),name:'Canopy',url:'https://goodday-os.vercel.app/m/canopy/key-decisions',goLive:'',statuses:mk({Discovery:'done',Data:'progress',Training:'progress',Reporting:'progress','SC Live':'progress',Wholesale:'progress','Go Live':'progress',WMS:'progress'}),custom:[C('FulFill','critical'),C('Order Routing','critical'),C('SKU Swap','critical'),C('Co-Man','progress'),C('Bundles','progress'),C('SPS','progress')],priorities:{now:['BoM sign off this week','Item Connection mapping / duplicate clean-up list','DCL wrap up (hopefully)','Amazon connections (+AWD separate locations)'],eventual:['WMS testing','Secondary storefront testing']}},
        {id:id(),name:'Sarah Flint',url:'https://goodday-os.vercel.app/m/sarah-flint',goLive:'',statuses:mk({Discovery:'done',Data:'done',Training:'done',Reporting:'done','SC Live':'done',Wholesale:'na','Go Live':'done',WMS:'progress'}),custom:[C('Presales','critical')],priorities:{now:['Presales solution (interim)','Moda/Trackstar update needed','Moda access requested'],eventual:['WMS testing']}},

      ]
    };
  }
  function load(){
    try{ var r=localStorage.getItem(KEY); if(r){ state=JSON.parse(r); migrateUrls(); return; } }catch(e){}
    state=seed(); save();
  }
  function migrateUrls(){
    var known={'canopy':'https://goodday-os.vercel.app/m/canopy/key-decisions','sarah flint':'https://goodday-os.vercel.app/m/sarah-flint','eric javits':'https://goodday-os.vercel.app/m/eric-javits-llc/key-decisions','the perfect jean':'https://goodday-os.vercel.app/m/the-perfect-jean/key-decisions','chief upland':'https://goodday-os.vercel.app/m/chief-gear-llc/key-decisions','peabody home':'https://goodday-os.vercel.app/m/peabody-home-llc/key-decisions'};
    var changed=false;
    (state.accounts||[]).forEach(function(a){ if(!a.url){ var k=(a.name||'').trim().toLowerCase(); if(known[k]){ a.url=known[k]; changed=true; } } });
    if(changed) save();
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function findAcct(aid){ for(var i=0;i<state.accounts.length;i++) if(state.accounts[i].id===aid) return state.accounts[i]; }

  function goLiveMeta(d){
    if(!d) return {cls:'',text:'Set date',sub:'—'};
    var dt=new Date(d+'T00:00:00'), t=new Date(); t.setHours(0,0,0,0);
    var days=Math.round((dt-t)/86400000);
    var text=dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    var cls='set',sub;
    if(days<0){cls='over';sub=Math.abs(days)+'d overdue';}
    else if(days===0){cls='soon';sub='Today';}
    else if(days<=14){cls='soon';sub='in '+days+'d';}
    else{sub='in '+days+'d';}
    return {cls:cls,text:text,sub:sub};
  }
  function goColors(cls){
    if(cls==='over') return ['#FDE2DD','#F24122','#9F200A'];
    if(cls==='soon') return ['#FCF0D4','#F2B322','#875C08'];
    if(cls==='set') return ['#E0F8EE','#23C48C','#0C3B2F'];
    return ['#FFFFFF','#DDE0E4','#616161'];
  }
  function cssv(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

  function render(){
    var cols=state.standardCols, nStd=cols.length;
    var nCustom=4; state.accounts.forEach(function(a){ nCustom=Math.max(nCustom,(a.custom||[]).length); });
    var board=document.getElementById('board');
    board.style.gridTemplateColumns='176px 116px repeat('+nStd+', 88px) 14px repeat('+nCustom+', 96px) 34px';

    var h='';
    // band row
    h+='<div style="grid-column:span 2"></div>';
    h+='<div class="band std" style="grid-column:span '+nStd+'">Standardized onboarding workstreams</div>';
    h+='<div style="grid-column:span 1"></div>';
    h+='<div class="band cust" style="grid-column:span '+(nCustom+1)+'">Customized workstreams</div>';
    // header row
    h+='<div class="hcell acct">Account</div><div class="hcell">Target go live</div>';
    cols.forEach(function(c){ h+='<div class="hcell">'+esc(c)+'</div>'; });
    h+='<div style="grid-column:span 1"></div>';
    h+='<div class="hcell custhint" style="grid-column:span '+(nCustom+1)+'">per-account add →</div>';

    var visible=state.accounts.filter(function(a){ return !search || a.name.toLowerCase().indexOf(search)>-1; });
    visible.sort(function(x,y){
      var dx=x.goLive||'', dy=y.goLive||'';
      if(dx&&dy){ return dx<dy?-1:(dx>dy?1:0); }
      if(dx&&!dy) return -1;   // dated before undated
      if(!dx&&dy) return 1;
      return 0;                // both undated: keep original order
    });
    visible.forEach(function(a){
      h+='<div class="acct" data-acct="'+a.id+'"><span class="bdot"></span><span class="name" contenteditable="true" spellcheck="false">'+esc(a.name)+'</span>'+(a.url?'<a class="acctlink" href="'+esc(a.url)+'" target="_blank" rel="noopener" title="Open onboarding tracker">↗</a>':'')+'<button class="del" title="Remove account">&times;</button></div>';
      var gm=goLiveMeta(a.goLive), gc=goColors(gm.cls);
      h+='<div class="golive" data-acct="'+a.id+'" style="background:'+gc[0]+';box-shadow:inset 0 0 0 1px '+gc[1]+'">'
        +'<span class="gt" style="color:'+gc[2]+'">'+esc(gm.text)+'</span>'
        +'<span class="gs" style="color:'+gc[2]+'">'+esc(gm.sub)+'</span>'
        +'<input type="date" value="'+(a.goLive||'')+'"></div>';
      cols.forEach(function(col){
        var st=a.statuses[col]||'blank', s=STATUS[st];
        var dim=filters[st]?'':' dim';
        h+='<div class="tile'+dim+'" data-acct="'+a.id+'" data-col="'+esc(col)+'" title="'+esc(col)+' · '+s.label+'" style="background:var('+s.bg+');box-shadow:inset 0 0 0 1px var('+s.bd+');color:var('+s.bd+')">'
          +'<span class="lbl" style="color:var('+s.tx+')">'+esc(col)+'</span></div>';
      });
      h+='<div style="grid-column:span 1"></div>';
      var list=a.custom||[];
      for(var i=0;i<nCustom;i++){
        var cc=list[i];
        if(cc){
          var s2=STATUS[cc.status]||STATUS.blank;
          var dim2=filters[cc.status]?'':' dim';
          var strike=cc.status==='na'?'text-decoration:line-through;':'';
          h+='<div class="tile cust'+dim2+'" data-acct="'+a.id+'" data-cust="'+cc.id+'" title="'+esc(cc.label)+' · '+s2.label+'" style="background:var('+s2.bg+');box-shadow:inset 0 0 0 1px var('+s2.bd+');color:var('+s2.bd+')">'
            +'<button class="del" title="Remove">&times;</button>'
            +'<span class="lbl" contenteditable="true" spellcheck="false" style="color:var('+s2.tx+');'+strike+'">'+esc(cc.label)+'</span></div>';
        } else {
          h+='<div class="cust-empty"></div>';
        }
      }
      h+='<button class="addcust" data-acct="'+a.id+'" title="Add customized workstream">+</button>';
    });
    board.innerHTML=h;
    if(!visible.length){ board.innerHTML+='<div style="grid-column:1/-1;padding:30px;text-align:center;color:#8A8A8A;font-size:13px">No accounts match your filter.</div>'; }
    wire();
    renderSummary();
  }

  function renderSummary(){
    var counts={done:0,progress:0,critical:0,na:0,blank:0}, total=0;
    state.accounts.forEach(function(a){
      state.standardCols.forEach(function(c){ counts[a.statuses[c]||'blank']++; total++; });
      (a.custom||[]).forEach(function(cc){ counts[cc.status]++; total++; });
    });
    var el=document.getElementById('summary'), h='';
    ORDER.forEach(function(k){ h+='<div class="metric"><span class="dot" style="background:'+STATUS[k].dot+'"></span>'+STATUS[k].label+' <b>'+counts[k]+'</b></div>'; });
    var pct=total?Math.round(counts.done/total*100):0;
    h+='<div style="flex:1"></div><div class="agg"><b>'+state.accounts.length+'</b> accounts · <b class="pct">'+pct+'%</b> milestones complete</div>';
    el.innerHTML=h;
  }

  function wire(){
    var board=document.getElementById('board');
    board.querySelectorAll('.acct[data-acct]').forEach(function(row){
      var a=findAcct(row.dataset.acct);
      var name=row.querySelector('.name');
      name.addEventListener('blur',function(){ a.name=(name.textContent||'').trim()||'Untitled'; save(); });
      name.addEventListener('keydown',function(e){ if(e.key==='Enter'){e.preventDefault();name.blur();} });
      row.querySelector('.del').addEventListener('click',function(){ state.accounts=state.accounts.filter(function(x){return x.id!==a.id;}); save(); render(); });
    });
    board.querySelectorAll('.golive').forEach(function(cell){
      var a=findAcct(cell.dataset.acct);
      var inp=cell.querySelector('input');
      inp.addEventListener('change',function(){ a.goLive=inp.value; save(); render(); });
      var openPicker=function(){ try{ if(typeof inp.showPicker==='function'){ inp.showPicker(); return; } }catch(err){} inp.focus(); };
      cell.addEventListener('click',function(){ openPicker(); });
    });
    board.querySelectorAll('.tile[data-col]').forEach(function(t){
      var a=findAcct(t.dataset.acct), col=t.dataset.col;
      t.addEventListener('click',function(e){ openMenu(e,function(k){ a.statuses[col]=k; save(); render(); },true); });
    });
    board.querySelectorAll('.tile[data-cust]').forEach(function(t){
      var a=findAcct(t.dataset.acct), cid=t.dataset.cust;
      var cc=(a.custom||[]).filter(function(x){return x.id===cid;})[0];
      var lbl=t.querySelector('.lbl');
      t.addEventListener('click',function(e){
        if(e.target.classList.contains('lbl')||e.target.classList.contains('del')) return;
        openMenu(e,function(k){ cc.status=k; save(); render(); });
      });
      lbl.addEventListener('blur',function(){ cc.label=(lbl.textContent||'').trim()||'Untitled'; save(); });
      lbl.addEventListener('keydown',function(e){ if(e.key==='Enter'){e.preventDefault();lbl.blur();} });
      t.querySelector('.del').addEventListener('click',function(e){ e.stopPropagation(); a.custom=a.custom.filter(function(x){return x.id!==cid;}); save(); render(); });
    });
    board.querySelectorAll('.addcust').forEach(function(b){
      var a=findAcct(b.dataset.acct);
      b.addEventListener('click',function(){ a.custom=a.custom||[]; a.custom.push({id:id(),label:'New',status:'blank'}); save(); render(); });
    });
  }

  var menu=document.getElementById('menu'), backdrop=document.getElementById('backdrop');
  function openMenu(e,cb,force){
    if(!force && (e.target.classList.contains('lbl')||e.target.classList.contains('del'))) return;
    menuCb=cb;
    menu.innerHTML=ORDER.map(function(k){var s=STATUS[k];return '<div class="opt" data-k="'+k+'"><span class="sw" style="background:var('+s.bg+');box-shadow:inset 0 0 0 1.5px var('+s.bd+')"></span>'+s.label+'</div>';}).join('');
    menu.querySelectorAll('.opt').forEach(function(o){ o.addEventListener('click',function(){ if(menuCb)menuCb(o.dataset.k); closeMenu(); }); });
    menu.classList.add('open'); backdrop.classList.add('open');
    var pw=menu.offsetWidth, ph=menu.offsetHeight;
    var x=Math.min(e.clientX, window.innerWidth-pw-10);
    var y=e.clientY+8; if(y+ph>window.innerHeight-10) y=e.clientY-ph-8;
    menu.style.left=x+'px'; menu.style.top=y+'px';
  }
  function closeMenu(){ menu.classList.remove('open'); backdrop.classList.remove('open'); menuCb=null; }
  backdrop.addEventListener('click',closeMenu);

  function buildChips(){
    var host=document.getElementById('chips');
    host.innerHTML=ORDER.map(function(k){var s=STATUS[k];return '<button class="chip" data-k="'+k+'"><span class="dot" style="background:'+s.dot+'"></span>'+s.label+'</button>';}).join('');
    host.querySelectorAll('.chip').forEach(function(c){
      c.addEventListener('click',function(){ var k=c.dataset.k; filters[k]=!filters[k]; c.classList.toggle('off',!filters[k]); render(); });
    });
  }

  document.getElementById('search').addEventListener('input',function(e){ search=e.target.value.toLowerCase(); render(); });
  document.getElementById('addAcct').addEventListener('click',function(){
    var st={}; state.standardCols.forEach(function(c){st[c]='blank';});
    state.accounts.push({id:id(),name:'New account',url:'',goLive:'',statuses:st,custom:[]}); save(); render();
  });
  document.getElementById('resetBtn').addEventListener('click',function(){
    if(confirm('Reset to the demo data? This clears your changes.')){ state=seed(); save(); render(); }
  });
  document.getElementById('exportBtn').addEventListener('click',function(){
    var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='goodday-onboarding-tracker.json'; a.click();
  });

  function renderPriorities(){
    var grid=document.getElementById('prioGrid');
    var host=document.getElementById('prioDate');
    var today=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
    host.textContent='Week of '+today;
    var h='';
    state.accounts.forEach(function(a){
      if(!a.priorities) a.priorities={now:[],eventual:[]};
      var p=a.priorities; if(!p.now)p.now=[]; if(!p.eventual)p.eventual=[];
      h+='<div class="pcard" data-acct="'+a.id+'">';
      h+='<h3><span class="bdot" style="width:9px;height:9px;border-radius:50%;background:#33CC99;display:inline-block"></span>'+esc(a.name);
      if(a.url) h+='<a href="'+esc(a.url)+'" target="_blank" rel="noopener">Open ↗</a>';
      h+='</h3>';
      h+=prioList(a.id,'now',p.now);
      h+='<div class="sub">Eventual</div>';
      h+=prioList(a.id,'eventual',p.eventual);
      h+='</div>';
    });
    grid.innerHTML=h;
    wirePriorities();
  }

  function prioList(aid,sec,items){
    var h='<ul class="plist" data-sec="'+sec+'">';
    items.forEach(function(x,i){
      h+='<li class="'+(sec==='eventual'?'evt':'')+'" data-i="'+i+'">'
        +'<span class="ptext" contenteditable="true" spellcheck="false">'+esc(x)+'</span>'
        +'<button class="pmove" title="'+(sec==='now'?'Move to Eventual':'Move to Now')+'">'+(sec==='now'?'↓':'↑')+'</button>'
        +'<button class="pdel" title="Remove">&times;</button>'
        +'</li>';
    });
    h+='<li class="padd" data-sec="'+sec+'">+ Add item</li>';
    h+='</ul>';
    return h;
  }

  function wirePriorities(){
    var grid=document.getElementById('prioGrid');
    grid.querySelectorAll('.pcard').forEach(function(card){
      var a=findAcct(card.dataset.acct); if(!a) return;
      card.querySelectorAll('.ptext').forEach(function(sp){
        sp.addEventListener('blur',function(){
          var li=sp.closest('li'), sec=li.parentNode.dataset.sec, i=+li.dataset.i;
          var v=sp.textContent.trim();
          if(!v){ a.priorities[sec].splice(i,1); save(); renderPriorities(); return; }
          a.priorities[sec][i]=v; save();
        });
        sp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); sp.blur(); } });
      });
      card.querySelectorAll('.pdel').forEach(function(b){
        b.addEventListener('click',function(){
          var li=b.closest('li'), sec=li.parentNode.dataset.sec, i=+li.dataset.i;
          a.priorities[sec].splice(i,1); save(); renderPriorities();
        });
      });
      card.querySelectorAll('.pmove').forEach(function(b){
        b.addEventListener('click',function(){
          var li=b.closest('li'), sec=li.parentNode.dataset.sec, i=+li.dataset.i;
          var to=sec==='now'?'eventual':'now';
          var v=a.priorities[sec].splice(i,1)[0];
          a.priorities[to].push(v); save(); renderPriorities();
        });
      });
      card.querySelectorAll('.padd').forEach(function(b){
        b.addEventListener('click',function(){
          var sec=b.dataset.sec;
          a.priorities[sec].push('New item'); save(); renderPriorities();
          // focus the newly added item's text for immediate editing
          var lists=card.querySelectorAll('.plist');
          var ul=b.parentNode;
          var newLi=ul.querySelector('li[data-i="'+(a.priorities[sec].length-1)+'"] .ptext');
          if(newLi){ var r=document.createRange(); r.selectNodeContents(newLi); var s=window.getSelection(); s.removeAllRanges(); s.addRange(r); newLi.focus(); }
        });
      });
    });
  }

  function switchView(v){
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active',t.dataset.view===v); });
    document.getElementById('view-scoreboard').classList.toggle('active',v==='scoreboard');
    document.getElementById('view-priorities').classList.toggle('active',v==='priorities');
    if(v==='priorities') renderPriorities();
  }
  document.getElementById('tabs').addEventListener('click',function(e){
    var t=e.target.closest('.tab'); if(t) switchView(t.dataset.view);
  });

  load(); buildChips(); render();
})();
</script>
